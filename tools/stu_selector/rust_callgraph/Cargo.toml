[package]
name = "rust_callgraph"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust_callgraph"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Standalone crate; do not get absorbed into any parent workspace.
[workspace]
